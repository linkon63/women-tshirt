<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Multi-Stop Gold Linear Gradient -->
    <linearGradient id="pjGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6BD"/>
      <stop offset="20%" stop-color="#FFDF6D"/>
      <stop offset="45%" stop-color="#FFC000"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Obsidian Luxury Background -->
    <linearGradient id="pjDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1715"/>
      <stop offset="50%" stop-color="#12100E"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="pjCenterGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#FFC000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFC000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFC000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Monogram Depth -->
    <filter id="monogramShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Dark Texture -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#pjDarkBg)"/>
  
  <!-- Subtle Center Radial Glow -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#pjCenterGlow)"/>

  <!-- Outer Radiant Gold Border -->
  <rect x="22" y="22" width="468" height="468" rx="112" fill="none" stroke="url(#pjGold)" stroke-width="7" stroke-opacity="0.85"/>

  <!-- Inner Hairline Border -->
  <rect x="33" y="33" width="446" height="446" rx="101" fill="none" stroke="#FFE57F" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Perfectly Centered Monogram Group -->
  <g transform="translate(6, 0)" filter="url(#monogramShadow)">
    <!-- ================= LETTER P ================= -->
    <!-- Vertical Main Stem -->
    <rect x="126" y="120" width="52" height="272" rx="4" fill="url(#pjGold)"/>
    
    <!-- Top & Bottom Serifs for Letter P -->
    <path d="M 112 120 L 192 120 L 192 134 L 112 134 Z" fill="url(#pjGold)"/>
    <path d="M 112 378 L 192 378 L 192 392 L 112 392 Z" fill="url(#pjGold)"/>

    <!-- P Loop (Outer curve & inner cutout) -->
    <path d="M 178 120 
             L 256 120 
             C 304 120, 332 148, 332 196 
             C 332 244, 304 272, 256 272 
             L 178 272 
             Z 
             M 178 164 
             L 248 164 
             C 274 164, 288 178, 288 196 
             C 288 214, 274 228, 248 228 
             L 178 228 
             Z" 
          fill="url(#pjGold)" 
          fill-rule="evenodd"/>

    <!-- ================= LETTER J ================= -->
    <!-- J Top Elegant Serif -->
    <path d="M 314 120 L 400 120 L 400 134 L 314 134 Z" fill="url(#pjGold)"/>
    
    <!-- J Vertical Stem & Smooth Descending Hook -->
    <path d="M 346 120 
             L 394 120 
             L 394 324 
             C 394 376, 356 406, 296 406 
             C 248 406, 212 384, 202 352 
             L 244 336 
             C 252 356, 270 368, 296 368 
             C 324 368, 346 350, 346 318 
             Z" 
          fill="url(#pjGold)"/>
  </g>

  <!-- Luxury 4-Point Diamond Sparkle (Top Right) -->
  <g transform="translate(414, 108)">
    <path d="M 0 -24 
             Q 0 0, 24 0 
             Q 0 0, 0 24 
             Q 0 0, -24 0 
             Q 0 0, 0 -24 Z" 
          fill="#FFFFFF" 
          opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="url(#pjGold)"/>
  </g>
</svg>
