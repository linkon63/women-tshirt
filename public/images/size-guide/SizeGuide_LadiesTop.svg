<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="500" height="500" fill="#FAFAFA" rx="16"/>

  <!-- T-Shirt Outline / Body -->
  <g stroke="#262626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <!-- Main garment body & sleeves -->
    <path d="M 185 85 C 205 102 295 102 315 85 L 390 125 L 350 200 L 315 185 L 315 410 L 185 410 L 185 185 L 150 200 L 110 125 Z" />
    
    <!-- Neck Ribbing / Collar Inner Arc -->
    <path d="M 185 85 C 210 120 290 120 315 85" fill="#F4F4F5" />
    <path d="M 195 87 C 215 110 285 110 305 87" stroke="#737373" stroke-width="1.5" />

    <!-- Sleeve seams -->
    <path d="M 185 185 L 185 85" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M 315 185 L 315 85" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Bottom hem seam -->
    <line x1="185" y1="398" x2="315" y2="398" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Sleeve hem seams -->
    <line x1="117" y1="135" x2="152" y2="194" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="383" y1="135" x2="348" y2="194" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Dimension Indicator A: Chest (বুকের মাপ) -->
  <g stroke="#EAB308" stroke-width="2" stroke-linecap="round">
    <line x1="185" y1="210" x2="315" y2="210" stroke-dasharray="5 4" />
    <circle cx="185" cy="210" r="3.5" fill="#CA8A04" />
    <circle cx="315" cy="210" r="3.5" fill="#CA8A04" />
  </g>
  <rect x="205" y="197" width="90" height="26" rx="6" fill="#FEFCE8" stroke="#EAB308" stroke-width="1.5" />
  <text x="250" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">বুকের মাপ / Chest</text>

  <!-- Dimension Indicator B: Length (লম্বা) -->
  <g stroke="#2563EB" stroke-width="2" stroke-linecap="round">
    <line x1="225" y1="96" x2="225" y2="410" stroke-dasharray="5 4" />
    <circle cx="225" cy="96" r="3.5" fill="#1D4ED8" />
    <circle cx="225" cy="410" r="3.5" fill="#1D4ED8" />
  </g>
  <rect x="175" y="280" width="85" height="26" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="217" y="297" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">লম্বা / Length</text>

  <!-- Dimension Indicator C: Sleeve Length (হাতা লম্বা) -->
  <g stroke="#059669" stroke-width="2" stroke-linecap="round">
    <line x1="315" y1="85" x2="378" y2="152" stroke-dasharray="5 4" />
    <circle cx="315" cy="85" r="3.5" fill="#047857" />
    <circle cx="378" cy="152" r="3.5" fill="#047857" />
  </g>
  <rect x="335" y="102" width="125" height="26" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
  <text x="397" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">হাতা লম্বা / Sleeve</text>

  <!-- Bottom Legend / Watermark -->
  <text x="250" y="475" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#737373" text-anchor="middle">Ladies Top-Bottom Set Measurement Guide</text>
</svg>
